# 台服 (TC) 建置檢查（GilDelta）。Dalamud 釘在 API13 (dalamud-pin-v13.0.0.16)。
# ⚠️ 直接建 GilDelta.csproj（不是 .sln）—— csproj 直建的 Platform 是 AnyCPU，
#    輸出落在 bin/Release/；GilDelta.sln 會把 Platform 逼成 x64，兩者靠 csproj 裡
#    顯式的 <OutputPath>bin\$(Configuration)\</OutputPath> 才會落在同一個地方。
name: Build Check

on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.x
            10.x
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
      - name: Download Dalamud (pinned TC-compatible build)
        shell: pwsh
        run: |
          $pinUrl = 'https://github.com/ffxiv-tc-port/Dalamud/releases/download/dalamud-pin-v13.0.0.17/dalamud-api13-net9.zip'
          Invoke-WebRequest -Uri $pinUrl -OutFile dalamud-pinned.zip
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath dalamud-pinned.zip).Hash
          if ($sha -ne '1481704F4DACBE96070F7B306FF1CE4BD77DB69C19CD74969FE296643E49EB5B') { throw "pinned Dalamud SHA256 mismatch: $sha" }
          Expand-Archive -Force dalamud-pinned.zip "$env:RUNNER_TEMP\dalamud-pinned\"
      - name: Build with dotnet
        run: dotnet build --configuration Release GilDelta.csproj -p:DalamudLibPath="$env:RUNNER_TEMP\dalamud-pinned\"
