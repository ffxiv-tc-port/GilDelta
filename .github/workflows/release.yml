# 台服 (TC) 發版（GilDelta）。由 DalamudPluginsTC 的 release_plugin.py 以
# workflow_dispatch 觸發，Dalamud 釘在 API13 (dalamud-pin-v13.0.0.16)。
#
# 🔴 dispatch-only 的 workflow 在新 repo 不會自動註冊 —— `gh workflow list` 看不到它，
#    release_plugin.py 的 dispatch 會回 404 workflow not found。唯一的註冊方法是
#    「對這個檔案做一次 commit 並推上去」，之後用
#      gh workflow list --repo ffxiv-tc-port/GilDelta
#    確認它出現。失敗形式是靜默的：repo 看起來正常，只有發版那一刻才會炸。
#
# ⚠️ 產出路徑不要用慣例去推。本 repo 的 csproj 顯式寫了
#      <OutputPath>bin\$(Configuration)\</OutputPath>
#    所以 csproj 直建與 sln 建都落在 bin/Release/，DalamudPackager 13 再把打包好的
#    外掛放進 bin/Release/GilDelta/：
#      bin/Release/GilDelta.dll             （組件）
#      bin/Release/GilDelta/latest.zip      （打包好的外掛）
#      bin/Release/GilDelta/GilDelta.json   （manifest）
#
# 🔴 資產名一律用 InternalName（GilDelta）—— DalamudPluginsTC 的 mirror_releases.py
#    是用「資產檔名去副檔名 == InternalName（忽略大小寫）」挑 own_assets 的。
name: Release

on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: 取 App token（runner 本機私鑰，private 子模組 checkout 用）
        id: app
        shell: pwsh
        run: |
          $keyPath = 'D:\ffxiv-tc-port\tctoolbox-app.pem'
          if (-not (Test-Path -LiteralPath $keyPath)) { throw "App private key not found on this runner: $keyPath" }
          function B64Url([byte[]]$b) { [Convert]::ToBase64String($b).TrimEnd('=').Replace('+', '-').Replace('/', '_') }
          $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $hdr = B64Url ([Text.Encoding]::UTF8.GetBytes('{"alg":"RS256","typ":"JWT"}'))
          $pl = B64Url ([Text.Encoding]::UTF8.GetBytes('{"iat":' + ($now - 60) + ',"exp":' + ($now + 540) + ',"iss":"4448133"}'))
          $rsa = [System.Security.Cryptography.RSA]::Create()
          $rsa.ImportFromPem((Get-Content -LiteralPath $keyPath -Raw))
          $sig = $rsa.SignData([Text.Encoding]::UTF8.GetBytes("$hdr.$pl"), [System.Security.Cryptography.HashAlgorithmName]::SHA256, [System.Security.Cryptography.RSASignaturePadding]::Pkcs1)
          $h = @{ Authorization = "Bearer $hdr.$pl.$(B64Url $sig)"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $inst = @(Invoke-RestMethod -Headers $h -Uri 'https://api.github.com/app/installations') | Where-Object { $_.account.login -eq 'ffxiv-tc-port' }
          if (-not $inst) { throw 'App 4448133 has no installation on org ffxiv-tc-port' }
          $tok = (Invoke-RestMethod -Method Post -Headers $h -Uri "https://api.github.com/app/installations/$($inst[0].id)/access_tokens").token
          if (-not $tok) { throw 'installation access token is empty' }
          Write-Host "::add-mask::$tok"
          "token=$tok" >> $env:GITHUB_OUTPUT
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ steps.app.outputs.token }}
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.x
            10.x
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
      - name: Download Dalamud (pinned TC-compatible build)
        shell: pwsh
        run: |
          $pin = 'D:\ffxiv-tc-port\dalamud-pins\dalamud-pin-v13.0.0.17\dalamud-api13-net9.zip'
          if (-not (Test-Path -LiteralPath $pin)) { throw "pinned Dalamud not found on this runner: $pin" }
          Copy-Item -LiteralPath $pin -Destination dalamud-pinned.zip
          Expand-Archive -Force dalamud-pinned.zip "$env:RUNNER_TEMP\dalamud-pinned\"
      - name: Compute version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v'
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build with dotnet
        run: dotnet build --configuration Release GilDelta.csproj -p:DalamudLibPath="$env:RUNNER_TEMP\dalamud-pinned\" -p:Version=${{ env.VER }} -p:AssemblyVersion=${{ env.VER }} -p:FileVersion=${{ env.VER }}
      - name: write version into manifest
        shell: pwsh
        run: |
          $path = './bin/Release/GilDelta/GilDelta.json'
          $json = Get-Content -Raw $path | ConvertFrom-Json
          $json.AssemblyVersion = "${{ env.VER }}"
          $json | ConvertTo-Json | Set-Content -Path $path
      - name: Rename artifact to GilDelta.zip
        shell: pwsh
        run: |
          Copy-Item './bin/Release/GilDelta/latest.zip' -Destination 'GilDelta.zip'
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            GilDelta.zip
            bin/Release/GilDelta/GilDelta.json
          generate_release_notes: true
